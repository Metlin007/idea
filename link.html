<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>连连看</title>
    <style>
        body {
            background-color: #ddd;
            /* 兼容 iOS < 11.2 */
            padding-bottom: constant(safe-area-inset-bottom);
            /* 兼容 iOS >= 11.2 */
            padding-bottom: env(safe-area-inset-bottom);
        }

        #info {
            text-align: center;
            margin: 20px 0;
        }

        #info select {
            margin-right: 10px;
            text-align: center;
        }

        #canvas {
            width: 100%;
            background-color: white;
        }
    </style>
</head>

<body>
    <div id="info">
        <select value="6" id="sizeSelect" onchange="init()">
            <option value="6">6x6</option>
            <option value="10">10x10</option>
        </select>
        剩余: <span id="count" style="margin-right: 10px;"></span>
        时间: <span id="time"></span>s
        <button onclick="init()" style="margin-left: 10px;">重玩</button>
    </div>
    <canvas id="canvas"></canvas>
</body>
<script>
    let canvas = document.getElementById('canvas')
    let ctx = canvas.getContext('2d');
    let width = canvas.offsetWidth
    canvas.style.height = width + 'px';
    canvas.width = width
    canvas.height = width

    let padding = 15
    let innerWidth = width - padding * 2
    let itemWidth
    let map
    let size
    let selected
    let count
    let interval
    let time
    init()

    canvas.onclick = function (e) {
        let x = e.offsetX
        let y = e.offsetY
        let i = Math.floor((y - padding) / itemWidth)
        let j = Math.floor((x - padding) / itemWidth)
        select(i + 1, j + 1)
    }

    // 初始化
    function init() {
        selected = null
        size = parseInt(sizeSelect.value)
        itemWidth = innerWidth / size
        count = size * size
        document.getElementById('count').innerText = count
        time = 0
        document.getElementById('time').innerText = time
        generateMap()

        // 计时器
        if (interval) clearInterval(interval)
        interval = setInterval("document.getElementById('time').innerText = ++time;", 1000);
    }
    // 生成地图
    function generateMap() {
        // 获取随机数组
        const list = []
        for (let i = 0; i < count / 2; ++i) {
            const t = Math.floor(1 + Math.random() * 20)
            list.push(t)
            list.push(t)
        }
        // 打乱顺序
        for (let i = list.length - 1; i > 0; --i) {
            const t = Math.floor(Math.random() * (i + 1))
            const temp = list[i]
            list[i] = list[t]
            list[t] = temp
        }

        // 初始化地图
        map = []
        for (let i = 0; i <= size + 1; ++i) {
            map[i] = []
            for (let j = 0; j <= size + 1; ++j)
                map[i][j] = i == 0 || j == 0 || i == size + 1 || j == size + 1 ? 0 : list[(i - 1) * size + j - 1]
        }

        update()
    }
    // 选择方块
    function select(i, j) {
        if (!map[i][j]) return

        let p = [i, j]
        let path
        if (!selected || i == selected[0] && j == selected[1] || map[i][j] != map[selected[0]][selected[1]] || !(path = getLinkPath(selected, p))) {
            selected = p
        } else {
            map[selected[0]][selected[1]] = 0
            map[p[0]][p[1]] = 0
            selected = null
            count -= 2
        }

        update(path)
    }
    // 更新地图
    function update(path) {
        document.getElementById('count').innerText = count
        if (count == 0) {
            clearInterval(interval)
            setTimeout('alert("胜利！");', 10)
        }
        draw(path)
    }
    function draw(path) {
        ctx.clearRect(0, 0, width, width)
        // 绘制方块
        ctx.fillStyle = 'aliceblue'
        for (let i = 1; i <= size; ++i) {
            for (let j = 1; j <= size; ++j) {
                if (map[i][j]) ctx.fillRect(padding + (j - 1) * itemWidth + 1, padding + (i - 1) * itemWidth + 1, itemWidth - 2, itemWidth - 2)
            }
        }
        // 绘制文字
        ctx.font = '18px Arial'
        ctx.fillStyle = 'black'
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (let i = 1; i <= size; ++i) {
            for (let j = 1; j <= size; ++j) {
                if (map[i][j]) ctx.fillText(
                    map[i][j],
                    padding + (j - 1) * itemWidth + itemWidth / 2,
                    padding + (i - 1) * itemWidth + itemWidth / 2
                )
            }
        }
        // 绘制边框
        if (selected) {
            ctx.strokeStyle = 'red'
            ctx.strokeRect(
                padding + (selected[1] - 1) * itemWidth,
                padding + (selected[0] - 1) * itemWidth,
                itemWidth,
                itemWidth
            )
        }
        // 绘制连线
        if (path) {
            console.log(path)
            ctx.strokeStyle = 'blue'
            ctx.beginPath();
            for (let i = 0; i < path.length - 1; i++) {
                if (i === 0) ctx.moveTo(px(path[i][1]), px(path[i][0]));
                ctx.lineTo(px(path[i + 1][1]), px(path[i + 1][0]));
            }
            ctx.stroke();
        }
    }
    function px(i) {
        if (i == 0) return padding / 2
        if (i == size + 1) return width - padding / 2
        return padding + (i - 1) * itemWidth + itemWidth / 2
    }
    // 获取路径
    function getLinkPath(a, b) {
        return get0foldPath(a, b) || get1foldPath(a, b) || get2foldPath(a, b)
    }
    // 0折连接路径（直连路径）
    function get0foldPath(a, b) {
        if (a[0] != b[0] && a[1] != b[1] || a[0] == b[0] && a[1] == b[1]) return

        if (a[0] == b[0]) {
            for (let i = Math.min(a[1], b[1]) + 1; i < Math.max(a[1], b[1]); ++i)
                if (map[a[0]][i] != 0) return
        } else {
            for (let i = Math.min(a[0], b[0]) + 1; i < Math.max(a[0], b[0]); ++i)
                if (map[i][a[1]] != 0) return
        }
        return [a, b]
    }
    // 1折连接路径
    function get1foldPath(a, b) {
        for (let p of [[a[0], b[1]], [b[0], a[1]]])
            if (map[p[0]][p[1]] == 0 && get0foldPath(a, p) && get0foldPath(p, b))
                return [a, p, b]
    }
    // 2折连接路径
    function get2foldPath(a, b) {
        for (let i = a[0] + 1; i < map.length; ++i) {
            if (map[i][a[1]]) break
            let path = get1foldPath([i, a[1]], b)
            if (path) return [a, ...path]
        }
        for (let i = a[0] - 1; i >= 0; --i) {
            if (map[i][a[1]]) break
            let path = get1foldPath([i, a[1]], b)
            if (path) return [a, ...path]
        }
        for (let j = a[1] + 1; j < map[0].length; ++j) {
            if (map[a[0]][j]) break
            let path = get1foldPath([a[0], j], b)
            if (path) return [a, ...path]
        }
        for (let j = a[1] - 1; j >= 0; --j) {
            if (map[a[0]][j]) break
            let path = get1foldPath([a[0], j], b)
            if (path) return [a, ...path]
        }
    }
</script>

</html>
