<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>美女扫雷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            color: white;
            margin-bottom: 15px;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        #statusBar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #statusBar span {
            font-size: 16px;
            color: #333;
            font-weight: bold;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(10, 36px);
            grid-gap: 2px;
            background-color: #999;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            /* 背景图片 - 请替换为你的图片路径 */
            background-image: url('assets/beauty.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .cell {
            width: 36px;
            height: 36px;
            background: linear-gradient(145deg, #555, #333);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.2s ease;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .cell:active {
            transform: scale(0.95);
        }

        .cell.revealed {
            background: none;
            box-shadow: none;
            cursor: default;
        }

        .cell.mine {
            background-color: #ff4444;
            animation: shake 0.5s ease;
        }

        .cell.flagged {
            background: linear-gradient(145deg, #ff9500, #ff6600);
        }

        /* 数字颜色 */
        .cell[data-count="1"] { color: #0000ff; }
        .cell[data-count="2"] { color: #008000; }
        .cell[data-count="3"] { color: #ff0000; }
        .cell[data-count="4"] { color: #000080; }
        .cell[data-count="5"] { color: #800000; }
        .cell[data-count="6"] { color: #008080; }
        .cell[data-count="7"] { color: #000000; }
        .cell[data-count="8"] { color: #808080; }

        #controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        #resetBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #resetBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        #modeBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        #message {
            margin-top: 15px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.9);
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }

        #message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 移动端适配 */
        @media (max-width: 420px) {
            #board {
                grid-template-columns: repeat(10, 32px);
            }

            .cell {
                width: 32px;
                height: 32px;
                font-size: 16px;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <h1>💎 美女扫雷 💎</h1>
    
    <div id="statusBar">
        <span id="mineCount">💣 地雷：15</span>
        <span id="timer">⏱️ 时间：0</span>
        <span id="flagCount">🚩 标记：0</span>
    </div>
    
    <div id="board"></div>
    
    <div id="controls">
        <button id="resetBtn">🔄 重新开始</button>
        <button id="modeBtn">🚩 标记模式：关</button>
    </div>
    
    <div id="message"></div>

    <script>
        // 游戏配置
        const CONFIG = {
            BOARD_SIZE: 10,
            MINE_COUNT: 15,
            CELL_SIZE: 36
        };

        // 游戏状态
        let state = {
            board: [],
            gameOver: false,
            timer: 0,
            timerInterval: null,
            flagCount: 0,
            flagMode: false,
            firstClick: true
        };

        // DOM 元素
        const elements = {
            board: document.getElementById('board'),
            mineCount: document.getElementById('mineCount'),
            timer: document.getElementById('timer'),
            flagCount: document.getElementById('flagCount'),
            resetBtn: document.getElementById('resetBtn'),
            modeBtn: document.getElementById('modeBtn'),
            message: document.getElementById('message')
        };

        // 初始化游戏
        function initGame() {
            // 重置状态
            state.board = [];
            state.gameOver = false;
            state.timer = 0;
            state.flagCount = 0;
            state.firstClick = true;
            
            // 清除定时器
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            
            // 清空棋盘
            elements.board.innerHTML = '';
            elements.message.classList.remove('show');
            
            // 初始化数据结构
            for (let i = 0; i < CONFIG.BOARD_SIZE; i++) {
                state.board[i] = [];
                for (let j = 0; j < CONFIG.BOARD_SIZE; j++) {
                    state.board[i][j] = {
                        isMine: false,
                        revealed: false,
                        flagged: false,
                        count: 0
                    };
                }
            }
            
            // 渲染棋盘
            renderBoard();
            updateStatus();
            startTimer();
        }

        // 布雷（保证第一次点击不踩雷）
        function placeMines(excludeRow, excludeCol) {
            let minesPlaced = 0;
            while (minesPlaced < CONFIG.MINE_COUNT) {
                const r = Math.floor(Math.random() * CONFIG.BOARD_SIZE);
                const c = Math.floor(Math.random() * CONFIG.BOARD_SIZE);
                
                // 排除第一次点击的位置及其周围
                if (Math.abs(r - excludeRow) <= 1 && Math.abs(c - excludeCol) <= 1) {
                    continue;
                }
                
                if (!state.board[r][c].isMine) {
                    state.board[r][c].isMine = true;
                    minesPlaced++;
                }
            }
            calculateNumbers();
        }

        // 计算周围地雷数
        function calculateNumbers() {
            for (let i = 0; i < CONFIG.BOARD_SIZE; i++) {
                for (let j = 0; j < CONFIG.BOARD_SIZE; j++) {
                    if (!state.board[i][j].isMine) {
                        state.board[i][j].count = countNearbyMines(i, j);
                    }
                }
            }
        }

        // 计算周围地雷数量
        function countNearbyMines(row, col) {
            let count = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    const r = row + i;
                    const c = col + j;
                    if (r >= 0 && r < CONFIG.BOARD_SIZE && 
                        c >= 0 && c < CONFIG.BOARD_SIZE && 
                        state.board[r][c].isMine) {
                        count++;
                    }
                }
            }
            return count;
        }

        // 渲染棋盘
        function renderBoard() {
            for (let i = 0; i < CONFIG.BOARD_SIZE; i++) {
                for (let j = 0; j < CONFIG.BOARD_SIZE; j++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = i;
                    cell.dataset.col = j;
                    
                    // 点击事件
                    cell.addEventListener('click', () => handleClick(i, j));
                    
                    // 长按标记（移动端）
                    let longPressTimer;
                    cell.addEventListener('touchstart', () => {
                        longPressTimer = setTimeout(() => {
                            toggleFlag(i, j);
                        }, 500);
                    });
                    
                    cell.addEventListener('touchend', () => {
                        clearTimeout(longPressTimer);
                    });
                    
                    elements.board.appendChild(cell);
                }
            }
        }

        // 处理点击
        function handleClick(row, col) {
            if (state.gameOver) return;
            
            const cellData = state.board[row][col];
            
            // 标记模式
            if (state.flagMode) {
                toggleFlag(row, col);
                return;
            }
            
            // 已揭示或已标记的格子不处理
            if (cellData.revealed || cellData.flagged) return;
            
            // 第一次点击时布雷
            if (state.firstClick) {
                state.firstClick = false;
                placeMines(row, col);
            }
            
            revealCell(row, col);
        }

        // 揭开格子
        function revealCell(row, col) {
            if (row < 0 || row >= CONFIG.BOARD_SIZE || 
                col < 0 || col >= CONFIG.BOARD_SIZE) return;
            
            const cellData = state.board[row][col];
            if (cellData.revealed || cellData.flagged) return;

            cellData.revealed = true;
            const cellElement = getCellElement(row, col);
            cellElement.classList.add('revealed');

            if (cellData.isMine) {
                cellElement.classList.add('mine');
                cellElement.textContent = '💣';
                endGame(false);
            } else {
                if (cellData.count > 0) {
                    cellElement.textContent = cellData.count;
                    cellElement.dataset.count = cellData.count;
                } else {
                    // 递归揭开空白区域
                    for (let i = -1; i <= 1; i++) {
                        for (let j = -1; j <= 1; j++) {
                            revealCell(row + i, col + j);
                        }
                    }
                }
                checkWin();
            }
        }

        // 切换标记
        function toggleFlag(row, col) {
            const cellData = state.board[row][col];
            if (cellData.revealed) return;
            
            cellData.flagged = !cellData.flagged;
            const cellElement = getCellElement(row, col);
            
            if (cellData.flagged) {
                cellElement.classList.add('flagged');
                cellElement.textContent = '🚩';
                state.flagCount++;
            } else {
                cellElement.classList.remove('flagged');
                cellElement.textContent = '';
                state.flagCount--;
            }
            
            updateStatus();
        }

        // 获取格子元素
        function getCellElement(row, col) {
            return document.querySelector(`.cell[data-row='${row}'][data-col='${col}']`);
        }

        // 检查胜利
        function checkWin() {
            let revealedCount = 0;
            for (let i = 0; i < CONFIG.BOARD_SIZE; i++) {
                for (let j = 0; j < CONFIG.BOARD_SIZE; j++) {
                    if (state.board[i][j].revealed && !state.board[i][j].isMine) {
                        revealedCount++;
                    }
                }
            }
            
            const totalSafe = CONFIG.BOARD_SIZE * CONFIG.BOARD_SIZE - CONFIG.MINE_COUNT;
            if (revealedCount === totalSafe) {
                endGame(true);
            }
        }

        // 结束游戏
        function endGame(win) {
            state.gameOver = true;
            clearInterval(state.timerInterval);
            
            elements.message.textContent = win 
                ? '🎉 恭喜！图片已完整揭示！' 
                : '💥 游戏结束，踩到地雷了！';
            elements.message.classList.add('show');
            
            // 显示所有地雷
            if (!win) {
                for (let i = 0; i < CONFIG.BOARD_SIZE; i++) {
                    for (let j = 0; j < CONFIG.BOARD_SIZE; j++) {
                        if (state.board[i][j].isMine) {
                            const cell = getCellElement(i, j);
                            cell.classList.add('revealed', 'mine');
                            cell.textContent = '💣';
                        }
                    }
                }
            }
        }

        // 更新状态栏
        function updateStatus() {
            elements.mineCount.textContent = `💣 地雷：${CONFIG.MINE_COUNT}`;
            elements.flagCount.textContent = `🚩 标记：${state.flagCount}`;
        }

        // 计时器
        function startTimer() {
            state.timerInterval = setInterval(() => {
                state.timer++;
                elements.timer.textContent = `⏱️ 时间：${state.timer}`;
            }, 1000);
        }

        // 重置定时器
        function resetTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
            }
            state.timer = 0;
            elements.timer.textContent = `⏱️ 时间：0`;
        }

        // 切换标记模式
        function toggleFlagMode() {
            state.flagMode = !state.flagMode;
            elements.modeBtn.textContent = state.flagMode 
                ? '🚩 标记模式：开' 
                : '🚩 标记模式：关';
            elements.modeBtn.style.background = state.flagMode
                ? 'linear-gradient(135deg, #f5576c 0%, #f093fb 100%)'
                : 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)';
        }

        // 事件绑定
        elements.resetBtn.addEventListener('click', () => {
            resetTimer();
            initGame();
        });

        elements.modeBtn.addEventListener('click', toggleFlagMode);

        // 启动游戏
        initGame();
    </script>
</body>
</html>
